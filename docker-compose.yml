# Só corre a aplicação: os dados ficam num ficheiro SQLite em ./data.
# Funciona apenas com este ficheiro (por exemplo, num NAS), porque usa a imagem publicada.
# Para compilar a partir do código: docker compose -f docker-compose.yml -f docker-compose.build.yml up --build

services:
  app:
    image: docker.io/eazyeight/voz-de-torres-vedras:latest
    pull_policy: always
    ports:
      - "${APP_PORT:-1400}:1400"
    environment:
      # Endereço público, usado no mapa do site.
      APP_URL: ${APP_URL:-http://localhost:1400}
      PORT: "1400"
      # De quantas em quantas horas verifica as origens oficiais. 0 desliga.
      UPDATE_INTERVAL_HOURS: ${UPDATE_INTERVAL_HOURS:-24}
      # Origens a não recolher, separadas por vírgulas (por exemplo, em máquinas com pouca memória).
      INGEST_DISABLED_SOURCES: ${INGEST_DISABLED_SOURCES:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
